[project]
name = "nio"
version = "1.0.0"
description = "NIO, the Nubian Ibex Optimizer, with its benchmark problems and studies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohammed Gamal" }]
requires-python = ">=3.12"
dependencies = [
    "kaleido>=1.4",
    "numpy>=2.5.4",
    "pillow>=12.3",
    "plotly>=7.1",
]

[project.urls]
Repository = "https://github.com/ragabai/nio"

[dependency-groups]
compare = [
    "mealpy>=3.0.2",
]
dev = [
    "ipykernel>=7.3",
    "nbconvert>=7.17",
    "nbformat>=5.11",
    "pytest>=9.1",
    "ruff>=0.16",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nio", "src/problems", "src/benchmarks", "src/plots", "src/utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests/nio", "tests/benchmarks"]  # the helper modules landscapes.py and markers.py
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # ×, ψ and τ in docstrings are intended
]

[tool.ruff.lint.isort]
known-first-party = ["nio", "problems", "benchmarks", "plots", "utils", "landscapes", "markers"]
